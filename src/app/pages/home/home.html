<!-- src/app/pages/home/home.html -->
<div class="home-container" style="padding: 16px; max-width: 1000px; margin: auto;">

  <mat-form-field appearance="outline" style="width: 100%; margin-bottom: 16px;">
    <mat-label>Filtrar películas</mat-label>
    <input matInput [formControl]="filter" placeholder="Nombre de la película" />
  </mat-form-field>

  <div *ngIf="loading" style="display: flex; justify-content: center; margin: 32px 0;">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>

  <table mat-table [dataSource]="dataSource" class="mat-elevation-z8" *ngIf="!loading" style="width: 100%;">

    <ng-container matColumnDef="title">
      <th mat-header-cell *matHeaderCellDef> Título </th>
      <td mat-cell *matCellDef="let movie"> {{ movie.title }} </td>
    </ng-container>

    <ng-container matColumnDef="release_date">
      <th mat-header-cell *matHeaderCellDef> Fecha </th>
      <td mat-cell *matCellDef="let movie"> {{ movie.release_date }} </td>
    </ng-container>

    <ng-container matColumnDef="vote_average">
      <th mat-header-cell *matHeaderCellDef> Rating </th>
      <td mat-cell *matCellDef="let movie"> {{ movie.vote_average }} </td>
    </ng-container>

    <ng-container matColumnDef="poster_path">
      <th mat-header-cell *matHeaderCellDef> Poster </th>
      <td mat-cell *matCellDef="let movie">
        <img width="50" [src]="'https://image.tmdb.org/t/p/w200' + movie.poster_path" alt="{{ movie.title }}" />
      </td>
    </ng-container>
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="!loading && dataSource.filteredData.length === 0" style="text-align: center; margin-top: 16px;">
    No se encontraron películas.
  </div>

  <!-- Paginador -->
  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>

</div>
